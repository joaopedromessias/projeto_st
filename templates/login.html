{% extends "base.html" %}


{% block conteudo %}
<section class="flex min-h-[70vh] items-center justify-center bg-gray-50 px-4 py-12">

    <div class="w-full max-w-md rounded-2xl border border-gray-100 bg-white p-8 shadow-xl sm:p-10">

        <!-- Cabeçalho -->
        <div class="mb-8 text-center">

            <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-red-100 text-red-700">
                <svg xmlns="http://www.w3.org/2000/svg"
                     class="h-7 w-7"
                     fill="none"
                     viewBox="0 0 24 24"
                     stroke="currentColor"
                     stroke-width="1.8">
                    <path stroke-linecap="round" stroke-linejoin="round"
                          d="M10 17l5-5-5-5m5 5H3M12 3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7"/>
                </svg>
            </div>

            <h1 class="text-3xl font-bold text-gray-900">
                Bem-vindo de volta<span class="text-red-600">.</span>
            </h1>

            <p class="mt-2 text-sm text-gray-500">
                Entre com seus dados para acessar sua conta.
            </p>

        </div>

        <!-- Formulário -->
        <form action="/login" method="POST" class="space-y-5">

            <!-- Nome -->
            <div>
                <label for="email"
                       class="mb-2 block text-sm font-semibold text-gray-700">
                    E-main
                </label>

                <input type="text"
                       id="email"
                       name="email"
                       autocomplete="username"
                       required
                       placeholder="Digite seu e-mail"
                       class="w-full rounded-xl border border-gray-300 bg-gray-50 px-4 py-3 text-gray-900 outline-none transition-all placeholder:text-gray-400 focus:border-red-500 focus:bg-white focus:ring-2 focus:ring-red-100">
            </div>

            <!-- Senha -->
            <div>
                <label for="senha"
                       class="mb-2 block text-sm font-semibold text-gray-700">
                    Senha
                </label>

                <div class="relative">

                    <input type="password"
                           id="senha"
                           name="senha"
                           autocomplete="current-password"
                           required
                           placeholder="Digite sua senha"
                           class="w-full rounded-xl border border-gray-300 bg-gray-50 px-4 py-3 pr-16 text-gray-900 outline-none transition-all placeholder:text-gray-400 focus:border-red-500 focus:bg-white focus:ring-2 focus:ring-red-100">

                    <button type="button"
                            id="mostrar-senha"
                            aria-label="Mostrar senha"
                            aria-pressed="false"
                            class="absolute inset-y-0 right-4 cursor-pointer text-sm font-semibold text-red-700 transition-colors hover:text-red-500">
                        Mostrar
                    </button>

                </div>
            </div>

            <!-- Botão de login -->
            <button type="submit"
                    class="w-full cursor-pointer rounded-xl bg-linear-to-r from-red-800 to-red-600 px-6 py-3.5 font-semibold text-white shadow-md transition-all duration-200 hover:from-red-700 hover:to-red-500 hover:shadow-lg active:scale-[0.98]">
                Entrar na minha conta
            </button>

        </form>

        <!-- Link de cadastro -->
        <div class="mt-8 border-t border-gray-100 pt-6 text-center">

            <p class="text-sm text-gray-500">
                Ainda não possui uma conta?

                <a href="/cadastro"
                   class="font-semibold text-red-700 transition-colors hover:text-red-500 hover:underline">
                    Criar conta
                </a>
            </p>

        </div>

    </div>

</section>

{% endblock %}

{% block script %}
<script>

    /* Mostrar ou ocultar a senha */

    const botaoMostrarSenha = document.querySelector("#mostrar-senha");
    const campoSenha = document.querySelector("#senha");

    botaoMostrarSenha.addEventListener("click", () => {
        const senhaVisivel = campoSenha.type === "text";

        campoSenha.type = senhaVisivel ? "password" : "text";
        botaoMostrarSenha.textContent = senhaVisivel ? "Mostrar" : "Ocultar";
        botaoMostrarSenha.setAttribute("aria-pressed", String(!senhaVisivel));
        botaoMostrarSenha.setAttribute(
            "aria-label",
            senhaVisivel ? "Mostrar senha" : "Ocultar senha"
        );
    });
</script>
{% endblock %}
