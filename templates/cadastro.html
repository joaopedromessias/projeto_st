{% extends "base.html" %}

{% block conteudo %}

<section class="flex min-h-[70vh] items-center justify-center bg-gray-50 px-4 py-12">

    <div class="w-full max-w-md rounded-2xl border border-gray-100 bg-white p-8 shadow-xl sm:p-10">

        <!-- Cabeçalho -->
        <div class="mb-8 text-center">
            <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-red-100 text-red-700">
                <svg xmlns="http://www.w3.org/2000/svg"
                     class="h-7 w-7" fill="none"
                     viewBox="0 0 24 24" stroke="currentColor"
                     stroke-width="1.8">
                    <path stroke-linecap="round" stroke-linejoin="round"
                          d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2m14-14v6m-3-3h6M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"/>
                </svg>
            </div>

            <h1 class="text-3xl font-bold text-gray-900">
                Crie sua conta<span class="text-red-600">.</span>
            </h1>

            <p class="mt-2 text-sm text-gray-500">
                Preencha seus dados para começar.
            </p>
        </div>

        <!-- Formulário -->
        <form action="/cadastro" method="POST" class="space-y-5">

            <!-- Nome -->
            <div>
                <label for="nome" class="mb-2 block text-sm font-semibold text-gray-700">
                    Nome
                </label>

                <input type="text"
                       id="nome"
                       name="nome"
                       autocomplete="given-name"
                       required
                       placeholder="Digite seu nome"
                       class="w-full rounded-xl border border-gray-300 bg-gray-50 px-4 py-3 text-gray-900 outline-none transition-all placeholder:text-gray-400 focus:border-red-500 focus:bg-white focus:ring-2 focus:ring-red-100">
            </div>

            <!-- Sobrenome -->
            <div>
                <label for="sobrenome" class="mb-2 block text-sm font-semibold text-gray-700">
                    Sobrenome
                </label>

                <input type="text"
                       id="sobrenome"
                       name="sobrenome"
                       autocomplete="family-name"
                       required
                       placeholder="Digite seu sobrenome"
                       class="w-full rounded-xl border border-gray-300 bg-gray-50 px-4 py-3 text-gray-900 outline-none transition-all placeholder:text-gray-400 focus:border-red-500 focus:bg-white focus:ring-2 focus:ring-red-100">
            </div>

             <div>
                <label for="sobrenome" class="mb-2 block text-sm font-semibold text-gray-700">
                    E-mail
                </label>

                <input type="email"
                       id="email"
                       name="email"
                       autocomplete="family-name"
                       required
                       placeholder="Digite seu e-mail"
                       class="w-full rounded-xl border border-gray-300 bg-gray-50 px-4 py-3 text-gray-900 outline-none transition-all placeholder:text-gray-400 focus:border-red-500 focus:bg-white focus:ring-2 focus:ring-red-100">
            </div>

            <!-- Senha -->
            <div>
                <label for="senha" class="mb-2 block text-sm font-semibold text-gray-700">
                    Senha
                </label>

                <input type="password"
                       id="senha"
                       name="senha"
                       autocomplete="new-password"
                       minlength="8"
                       required
                       placeholder="Mínimo de 8 caracteres"
                       class="w-full rounded-xl border border-gray-300 bg-gray-50 px-4 py-3 text-gray-900 outline-none transition-all placeholder:text-gray-400 focus:border-red-500 focus:bg-white focus:ring-2 focus:ring-red-100">

                <p class="mt-2 text-xs text-gray-400">
                    Utilize pelo menos 8 caracteres.
                </p>
            </div>

            <!-- Botão -->
            <button type="submit"
                    class="w-full cursor-pointer rounded-xl bg-linear-to-r from-red-800 to-red-600 px-6 py-3.5 font-semibold text-white shadow-md transition-all duration-200 hover:from-red-700 hover:to-red-500 hover:shadow-lg active:scale-[0.98]">
                Criar minha conta
            </button>

        </form>

        <!-- Link de login -->
        <div class="mt-8 border-t border-gray-100 pt-6 text-center">
            <p class="text-sm text-gray-500">
                Já possui uma conta?
                <a href="/login"
                   class="font-semibold text-red-700 transition-colors hover:text-red-500 hover:underline">
                    Fazer login
                </a>
            </p>
        </div>

    </div>

</section>

{% endblock %}
