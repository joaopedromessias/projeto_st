<script type="text/javascript">

    /* Parte responsável por abrir e fechar o menu hamburguer da navbar mobile */
    const botaoAbrir = document.querySelector("#abrir-menu");
    const botaoFechar = document.querySelector("#fechar-menu");
    const menu = document.querySelector("#menu-lateral");

    function definirMenu(aberto) {
        menu.classList.toggle("translate-x-full", !aberto);
        menu.setAttribute("aria-hidden", String(!aberto));
        menu.inert = !aberto;
        botaoAbrir.setAttribute("aria-expanded", String(aberto));
    }

    botaoAbrir.addEventListener("click", () => definirMenu(true));
    botaoFechar.addEventListener("click", () => definirMenu(false));
    /* Fim Parte responsável por abrir e fechar o menu hamburguer da navbar mobile */
</script>

</html>
